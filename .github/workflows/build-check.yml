name: build-check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iconic-films
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iconic-films/package-lock.json
      - run: npm ci
      - name: Build and capture diagnostics
        id: build
        shell: bash
        run: |
          set +e
          npm run build > /tmp/iconic-build.log 2>&1
          code=$?
          cat /tmp/iconic-build.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish build error
        if: steps.build.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'Automated build diagnostic for commit `${{ github.sha }}`.'
            echo
            echo '~~~'
            tail -n 180 /tmp/iconic-build.log
            echo '~~~'
          } > /tmp/issue-body.md
          short=$(echo "$GITHUB_SHA" | cut -c1-8)
          gh issue create --repo "$GITHUB_REPOSITORY" --title "BUILD-DIAGNOSTIC $short" --body-file /tmp/issue-body.md
          exit 1
