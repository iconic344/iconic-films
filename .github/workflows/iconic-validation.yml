name: ICONIC validation
on:
  push:
    branches: [main, repair-iconic-admin-session]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: iconic-films
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify production access after deployment
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          base = 'https://iconic-films-six.vercel.app'
          def get(path):
              req = urllib.request.Request(base+path, headers={'Cache-Control':'no-cache'})
              return urllib.request.urlopen(req, timeout=20)

          config = None
          for attempt in range(36):
              try:
                  with get('/') as page:
                      page_ok = page.status == 200
                  with get('/api/config?verify='+str(attempt)) as response:
                      api_ok = response.status == 200
                      payload = json.load(response)
                      config = payload.get('config')
                  if page_ok and api_ok and isinstance(config, dict):
                      break
              except Exception as error:
                  print('Waiting for production:', type(error).__name__)
              time.sleep(5)
          else:
              raise AssertionError('Production site or API did not become available')

          assert isinstance(config.get('works', []), list)
          assert isinstance(config.get('tracks', []), list)
          assert isinstance(config.get('teamMembers', []), list)
          assert 'chatgpt.site' not in json.dumps(config)

          with get('/api/auth') as response:
              assert response.status == 200
              assert json.load(response).get('authenticated') is False

          print(json.dumps({
              'page': 200,
              'api': 200,
              'designFields': len(config),
              'works': len(config.get('works', [])),
              'tracks': len(config.get('tracks', [])),
              'teamMembers': len(config.get('teamMembers', []))
          }))
          PY
