name: ICONIC validation
on:
  push:
    branches: [main, repair-iconic-admin-session]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: iconic-films
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify production access after deployment
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, re, time, urllib.request
          from pathlib import Path
          base = 'https://iconic-films-six.vercel.app'
          revision = 'iconic-recovery-20261003-v1'
          def get(path, ranged=False):
              headers = {'Cache-Control': 'no-cache'}
              if ranged: headers['Range'] = 'bytes=0-15'
              return urllib.request.urlopen(urllib.request.Request(base+path, headers=headers), timeout=20)
          for attempt in range(36):
              try:
                  with get('/api/config?verify='+revision) as response:
                      ready = response.headers.get('X-Iconic-Revision') == revision
                      config = json.load(response).get('config')
                  if ready: break
              except Exception as error:
                  print('Waiting for Vercel:', type(error).__name__)
              time.sleep(5)
          else: raise AssertionError('Vercel has not published the verified API revision')
          assert config and len(config) >= 64
          assert len(config['works']) == 1 and len(config['tracks']) == 28
          assert 'chatgpt.site' not in json.dumps(config)
          with get('/') as response: assert response.status == 200
          with get('/api/auth') as response:
              assert response.status == 200 and json.load(response)['authenticated'] is False
          paths = set()
          def visit(value):
              if isinstance(value, str) and re.fullmatch(r'/media/[a-f0-9-]{36}\.[a-z0-9]+', value): paths.add(value)
              elif isinstance(value, list):
                  for item in value: visit(item)
              elif isinstance(value, dict):
                  for item in value.values(): visit(item)
          visit(json.loads(Path('src/site-config.json').read_text()))
          def media(path):
              with get(path, True) as response:
                  assert response.status in (200, 206)
                  assert 'text/html' not in response.headers.get('Content-Type', '')
                  assert response.read(16)
              return path
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              checked = list(pool.map(media, sorted(paths)))
          assert len(checked) == 33
          print(json.dumps({'page': 200, 'api': 200, 'designFields': len(config), 'works': len(config['works']), 'tracks': len(config['tracks']), 'mediaFiles': len(checked), 'revision': revision}))
          PY
