<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="VIIVIIsara® — Film & Direction." />
    <title>VIIVIIsara®</title>
    <!-- Render this BEFORE React/CSS loads; no light-theme flash or page jumps
         while the server's authoritative hero/video is being resolved. -->
    <style id="viivii-startup-style">
      html,body{margin:0;min-height:100%;background:#09090b}
      #viivii-startup{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:#0b0b0d;color:#eee;pointer-events:all;opacity:1;visibility:visible;transition:opacity .46s cubic-bezier(.2,.7,.3,1),visibility 0s linear .46s}
      html[data-site-boot-ready="true"] #viivii-startup{opacity:0;visibility:hidden;pointer-events:none}
      #viivii-startup .brandmark{font:600 clamp(19px,3.5vw,34px)/1 Arial,Helvetica,sans-serif;letter-spacing:-.065em;opacity:.79;white-space:nowrap}
      #viivii-startup .brandmark em{font:italic 400 1em/1 Georgia,serif}
      #viivii-startup .track{position:absolute;left:50%;bottom:clamp(34px,6vh,70px);transform:translateX(-50%);height:1px;width:min(148px,38vw);overflow:hidden;background:rgba(255,255,255,.12)}
      #viivii-startup .track::after{content:"";position:absolute;inset:0;width:40%;background:rgba(255,255,255,.72);animation:viivii-startup-line 1.5s cubic-bezier(.5,0,.2,1) infinite}
      @keyframes viivii-startup-line{from{transform:translateX(-110%)}to{transform:translateX(350%)}}
      @media(prefers-reduced-motion:reduce){#viivii-startup .track::after{animation:none}}
    </style>
  </head>
  <body class="antialiased"><div id="viivii-startup" role="status" aria-label="사이트를 준비하는 중"><span class="brandmark">VIIVII <em>sara</em></span><span class="track" aria-hidden="true"></span></div><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
