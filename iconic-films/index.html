<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="description" content="VIIVIIsara® — Film & Direction." />
  <title>VIIVIIsara®</title>
  <link rel="preload" as="image" href="/viivii-loading-logo.svg" type="image/svg+xml" />
  <!-- This exists before React to protect the ready hero from flash/reflow. -->
  <style id="viivii-startup-style">
    #viivii-startup, #viivii-startup * { cursor:none!important }
    #viivii-startup{
      position:fixed;inset:0;z-index:2147483000;
      display:grid;place-items:center;overflow:hidden;
      isolation:isolate;
      background:transparent;color:#fff;pointer-events:all;
      opacity:1;visibility:visible;
      transition:opacity .22s ease-out 1.55s,visibility 0s linear 1.77s
    }
    /* ONE full-screen black sheet, lifted upward from the bottom edge.
       No left/right door panels, no hinge/slit, no perspective distortion.
       Underlying homepage is visible from bottom to top as the sheet rises. */
    #viivii-startup .viivii-rise-curtain{
      position:absolute;inset:0;z-index:1;
      display:grid;place-items:center;background:#000;
      backface-visibility:hidden;transform:translate3d(0,0,0);
      will-change:transform;
      transition:transform 1.46s cubic-bezier(.22,.76,.18,1) .12s;
    }
    #viivii-startup .viivii-rise-curtain::after{
      content:"";position:absolute;inset:auto 0 -25px 0;height:25px;
      background:linear-gradient(to bottom,rgba(0,0,0,.22),rgba(0,0,0,0));
      pointer-events:none;
    }
    #viivii-startup .viivii-duo-focus{
      position:absolute;inset:0;z-index:0;pointer-events:none;
      -webkit-backdrop-filter:blur(7px);
      backdrop-filter:blur(7px);
      opacity:0;will-change:opacity
    }
    #viivii-loading-logo-wrap{
      position:relative;z-index:2;display:grid;place-items:center;
      width:clamp(190px,29vw,318px);aspect-ratio:1;
      perspective:980px;pointer-events:none;
      transition:opacity .75s cubic-bezier(.24,.72,.22,1),
        transform 1.10s cubic-bezier(.16,.8,.22,1);
    }
    #viivii-loading-object{
      position:relative;width:100%;height:100%;
      transform-style:preserve-3d;backface-visibility:visible;
      animation:viivii-auto-turn 11.5s linear infinite;
      filter:drop-shadow(0 4px 16px rgba(255,255,255,.045))
    }
    #viivii-loading-object::before,
    #viivii-loading-object .viivii-loading-base,
    #viivii-loading-object .viivii-loading-ink-window{
      position:absolute;inset:0;
      -webkit-mask:url('/viivii-loading-logo.svg') center/contain no-repeat;
      mask:url('/viivii-loading-logo.svg') center/contain no-repeat;
    }
    #viivii-loading-object::before{
      content:"";background:rgba(255,255,255,.10);transform:translateZ(-3px)
    }
    #viivii-loading-object .viivii-loading-base{
      background:rgba(255,255,255,.34);transform:translateZ(0)
    }
    #viivii-loading-object .viivii-loading-ink-window{
      overflow:hidden;transform:translateZ(1px)
    }
    #viivii-loading-object .viivii-loading-ink-flow{
      position:absolute;inset:0 auto 0 -10%;width:118%;
      background:#fff;
      -webkit-clip-path:polygon(0 0,94% 0,96% 8%,93% 16%,96.6% 26%,94.5% 35%,97% 43%,93.5% 54%,96% 63%,93.5% 72%,96.5% 82%,93.5% 90%,95.5% 100%,0 100%);
      clip-path:polygon(0 0,94% 0,96% 8%,93% 16%,96.6% 26%,94.5% 35%,97% 43%,93.5% 54%,96% 63%,93.5% 72%,96.5% 82%,93.5% 90%,95.5% 100%,0 100%);
      animation:viivii-loading-ink 2.2s cubic-bezier(.37,0,.17,1) infinite;
      will-change:transform
    }
    #viivii-loading-object .viivii-loading-ink-flow::after{
      content:"";position:absolute;right:1%;top:9%;height:82%;width:7%;pointer-events:none;
      background:radial-gradient(circle at 18% 8%,#fff 0 3px,transparent 3.4px),
      radial-gradient(circle at 66% 34%,#fff 0 2px,transparent 2.4px),
      radial-gradient(circle at 22% 58%,#fff 0 3.5px,transparent 4px),
      radial-gradient(circle at 80% 89%,#fff 0 2px,transparent 2.4px);
    }
    @keyframes viivii-loading-ink{
      0%,6%{transform:translateX(-118%)}
      76%,94%,100%{transform:translateX(0)}
    }
    @keyframes viivii-auto-turn{
      0%{transform:rotateX(-3deg) rotateY(0deg)}
      50%{transform:rotateX(3deg) rotateY(180deg)}
      100%{transform:rotateX(-3deg) rotateY(360deg)}
    }
    /* A continuous bottom-to-top lift with a soft trailing edge.
       The real preloaded homepage appears directly underneath; no cloned UI,
       separate media playback, mouse-driven motion or content reflow. */
    html[data-site-boot-ready="true"] #viivii-startup{
      pointer-events:none;opacity:0;visibility:hidden
    }
    html[data-site-boot-ready="true"] #viivii-startup .viivii-rise-curtain{
      transform:translate3d(0,-105%,0)
    }
    html[data-site-boot-ready="true"] #viivii-loading-logo-wrap{
      opacity:0;transform:translate3d(0,-14px,0) scale(.975)
    }
    html[data-site-boot-ready="true"] #viivii-startup .viivii-duo-focus{
      animation:viivii-unlock-focus 1.52s cubic-bezier(.22,.72,.2,1) both
    }
    /* Hold one small blur kernel and fade its layer instead of
       animating expensive fullscreen backdrop blur on mobile Safari. */
    @keyframes viivii-unlock-focus{
      0%{opacity:0}
      18%{opacity:.55}
      55%{opacity:.36}
      84%{opacity:.08}
      100%{opacity:0}
    }
    @media(max-width:600px){
      #viivii-loading-logo-wrap{width:clamp(190px,61vw,270px)}
    }
    @media(prefers-reduced-motion:reduce){
      #viivii-loading-object{animation:none!important;transform:none!important}
      #viivii-loading-object .viivii-loading-ink-flow{animation:none!important;transform:translateX(0)!important}
      #viivii-loading-logo-wrap{transition:opacity .16s linear!important}
      #viivii-startup .viivii-rise-curtain{transition:opacity .16s linear!important}
      html[data-site-boot-ready="true"] #viivii-startup .viivii-rise-curtain{transform:none!important;opacity:0!important}
      html[data-site-boot-ready="true"] #viivii-startup .viivii-duo-focus{animation:none!important}
      #viivii-startup{transition:opacity .16s linear,visibility 0s linear .16s!important}
    }
  </style>
</head>
<body class="antialiased">
  <div id="viivii-startup" role="status" aria-label="사이트 로딩 중">
    <div class="viivii-duo-focus" aria-hidden="true"></div>
    <div class="viivii-rise-curtain" aria-hidden="true">
      <div id="viivii-loading-logo-wrap">
        <div id="viivii-loading-object">
          <span class="viivii-loading-base"></span>
          <span class="viivii-loading-ink-window">
            <span class="viivii-loading-ink-flow"></span>
          </span>
        </div>
      </div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
